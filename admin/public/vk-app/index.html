<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Подтверждение телефона</title>
  <!-- Подключение VK Bridge CDN -->
  <script src="https://unpkg.com/@vkontakte/vk-bridge/dist/browser.min.js"></script>
  <style>
    body {
      font-family: -apple-system, system-ui, Helvetica Neue, Roboto, sans-serif;
      background-color: #f5f5f5;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      padding: 16px;
      box-sizing: border-box;
    }
    .card {
      background: white;
      border-radius: 16px;
      padding: 28px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.06);
      text-align: center;
      max-width: 360px;
      width: 100%;
    }
    .icon {
      font-size: 40px;
      margin-bottom: 16px;
    }
    .title {
      font-size: 20px;
      font-weight: 600;
      color: #000;
      margin-bottom: 8px;
    }
    .desc {
      font-size: 14px;
      color: #818c99;
      margin-bottom: 24px;
      line-height: 1.5;
    }
    .btn {
      background-color: #2688eb;
      color: white;
      border: none;
      border-radius: 10px;
      padding: 14px 24px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
      transition: background-color 0.2s, transform 0.1s;
    }
    .btn:active {
      transform: scale(0.98);
    }
    .btn:hover {
      background-color: #1e76ca;
    }
    .status {
      margin-top: 16px;
      font-size: 14px;
      font-weight: 600;
      line-height: 1.4;
    }
    .success { color: #4bb34b; }
    .error { color: #e64646; }
    .loader {
      display: inline-block;
      width: 28px;
      height: 28px;
      border: 3px solid rgba(38, 136, 235, 0.15);
      border-radius: 50%;
      border-top-color: #2688eb;
      animation: spin 0.8s linear infinite;
      margin-bottom: 16px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="card">
    <!-- Спиннер загрузки -->
    <div id="loading-spinner" style="display: none;">
      <div class="loader"></div>
      <div class="title">Отправка запроса...</div>
    </div>
    
    <!-- Основной блок -->
    <div id="content-block">
      <div class="icon">⚡</div>
      <div class="title">Подтверждение номера</div>
      <div class="desc">Для привязки бонусной карты iikoCard подтвердите ваш номер телефона, привязанный к аккаунту ВКонтакте.</div>
      <button class="btn" id="verify-btn">Подтвердить в 1 клик</button>
    </div>
    
    <!-- Блок со статусом -->
    <div id="status-block" class="status" style="display: none;"></div>
  </div>

  <script>
    // 1. Инициализация VK Bridge при запуске
    vkBridge.send('VKWebAppInit');

    const verifyBtn = document.getElementById('verify-btn');
    const loadingSpinner = document.getElementById('loading-spinner');
    const contentBlock = document.getElementById('content-block');
    const statusBlock = document.getElementById('status-block');

    // Функция получения query-строки запуска VK Mini App
    function getQueryParams() {
      return window.location.search;
    }

    // Извлекаем VK ID из параметров запуска
    function getVkUserId() {
      const urlParams = new URLSearchParams(window.location.search);
      return urlParams.get('vk_user_id');
    }

    verifyBtn.addEventListener('click', async () => {
      contentBlock.style.display = 'none';
      loadingSpinner.style.display = 'block';
      statusBlock.style.display = 'none';

      try {
        // 2. Запрашиваем номер телефона через VK Bridge
        const phoneData = await vkBridge.send('VKWebAppGetPhoneNumber');
        
        if (phoneData && phoneData.phone_number) {
          const vk_id = parseInt(getVkUserId());
          const query_params = getQueryParams();
          
          if (!vk_id) {
            throw new Error('ID пользователя ВК не найден в параметрах запуска.');
          }

          // 3. Отправляем полученный телефон и подпись параметров на бэкенд
          const response = await fetch('https://vezuroll.ru/api/v1/validation/vk-miniapp-phone', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json'
            },
            body: JSON.stringify({
              vk_id: vk_id,
              phone: phoneData.phone_number,
              query_params: query_params
            })
          });

          const result = await response.json();

          if (response.ok && result.status === 'success') {
            loadingSpinner.style.display = 'none';
            statusBlock.style.display = 'block';
            statusBlock.className = 'status success';
            statusBlock.innerHTML = '🎉 Проверка пройдена! Бонусная карта привязана. Возвращаемся в диалог...';
            
            // 4. Закрываем мини-приложение через 2.5 секунды
            setTimeout(() => {
              vkBridge.send('VKWebAppClose', { status: 'success' });
            }, 2500);
          } else {
            throw new Error(result.detail || 'Не удалось привязать номер на сервере.');
          }
        } else {
          throw new Error('Не удалось получить номер телефона.');
        }
      } catch (err) {
        loadingSpinner.style.display = 'none';
        contentBlock.style.display = 'block';
        statusBlock.style.display = 'block';
        statusBlock.className = 'status error';
        statusBlock.innerHTML = '❌ Ошибка: ' + (err.message || 'пользователь отклонил доступ к номеру.');
      }
    });
  </script>
</body>
</html>
