services:
  db:
    image: postgres:15-alpine
    container_name: foodtech-db
    restart: always
    environment:
      POSTGRES_DB: ${DB_DATABASE:-foodtech_db}
      POSTGRES_USER: ${DB_USERNAME:-foodtech_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    shm_size: 256m
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-foodtech_user} -d ${DB_DATABASE:-foodtech_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "15m"
        max-file: "2"

  redis:
    image: redis:alpine
    container_name: foodtech-redis
    restart: always
    ports:
      - "6379:6379"
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  backend:
    build:
      context: ./backend
    container_name: foodtech-backend
    restart: always
    env_file: .env
    environment:
      - PYTHONIOENCODING=utf-8
      - DATABASE_URL=postgresql://${DB_USERNAME:-foodtech_user}:${DB_PASSWORD:-postgres}@db:5432/${DB_DATABASE:-foodtech_db}
      - REDIS_URL=redis://redis:6379/0
      - API_RELOAD=True
      - APP_PUBLIC_URL=https://vezuroll.ru
    expose:
      - "8000"
    volumes:
      - ./backend:/app
      - /root/foodzuka/admin/public/media:/app/media
      - /var/run/docker.sock:/var/run/docker.sock
      - /root/foodzuka:/host_foodzuka:rw
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
    ulimits:
      nofile:
        soft: 65536
        hard: 65536

  worker:
    build:
      context: ./backend
    container_name: foodtech-worker
    restart: always
    env_file: .env
    command: celery -A app.core.celery_app worker --loglevel=info --concurrency=2 --max-tasks-per-child=100
    environment:
      - PYTHONIOENCODING=utf-8
      - DATABASE_URL=postgresql://${DB_USERNAME:-foodtech_user}:${DB_PASSWORD:-postgres}@db:5432/${DB_DATABASE:-foodtech_db}
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - ./backend:/app
      - /root/foodzuka/admin/public/media:/app/media
    depends_on:
      - db
      - redis
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
    ulimits:
      nofile:
        soft: 65536
        hard: 65536

  bot:
    build:
      context: ./bot
    container_name: foodtech-bot
    restart: always
    environment:
      - PYTHONIOENCODING=utf-8
      - API_URL=http://backend:8000/api/v1
    volumes:
      - ./bot:/app
    depends_on:
      - backend
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  admin:
    build:
      context: /root/foodzuka/admin
    container_name: foodtech-admin
    env_file: .env
    restart: always
    environment:
      - DB_HOST=db
      - DB_CONNECTION=pgsql
      - DB_PORT=5432
      - DB_DATABASE=${DB_DATABASE:-foodtech_db}
      - DB_USERNAME=${DB_USERNAME:-foodtech_user}
      - DB_PASSWORD=${DB_PASSWORD:-postgres}
      - REDIS_HOST=redis
    volumes:
      - /root/foodzuka/admin:/var/www/html
    expose:
      - "8000"
      - "5173"
    depends_on:
      db:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  frontend:
    build:
      context: ./frontend
    container_name: foodtech-frontend
    restart: always
    expose:
      - "5173"
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  nginx:
    image: nginx:alpine
    container_name: foodtech-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./configs/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
      - /root/foodzuka/admin/public:/var/www/html/admin/public:ro
    depends_on:
      - frontend
      - admin
      - backend
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  certbot:
    image: certbot/certbot:latest
    container_name: foodtech-certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

volumes:
  postgres_data:
