server {
    listen 80;
    server_name 72roll.ru www.72roll.ru vezuroll.ru www.vezuroll.ru;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name 72roll.ru www.72roll.ru vezuroll.ru www.vezuroll.ru;
    client_max_body_size 50M;

    ssl_certificate /etc/letsencrypt/live/vezuroll.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vezuroll.ru/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    location /api {
        resolver 127.0.0.11 valid=30s;
        set $backend_service "http://backend:8000";
        proxy_pass $backend_service;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Обслуживание ассетов Vite из корня (необходимо, так как ASSET_URL в .env без /admin)
    location /build/ {
        root /var/www/html/admin/public;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Обслуживание статических файлов из корня для админки
    location ~ ^/(favicon.ico|loader.css|robots.txt)$ {
        root /var/www/html/admin/public;
        try_files $uri =404;
    }

    # Универсальная обработка для статики в /build/ (с префиксом /admin или /pers)
    location ~ ^/(admin|pers)/build/(.*)$ {
        alias /var/www/html/admin/public/build/$2;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Обработка /admin и /pers через один корень
    location ~ ^/(admin|pers) {
        root /var/www/html/admin/public;
        
        # Если файл существует по пути (например, favicon.ico), отдаем его
        # Если нет, отправляем в index.php
        try_files $uri $uri/ /index.php?$query_string;

        location ~ \.php$ {
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
            fastcgi_pass admin:9000;
            fastcgi_param REQUEST_URI $request_uri;
            fastcgi_param SCRIPT_NAME /index.php;
        }
    }

    # На всякий случай прописываем корень для PHP вне блоков
    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_pass admin:9000;
    }

    location / {
        proxy_pass http://frontend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
