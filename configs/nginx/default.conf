# Включаем сжатие gzip
gzip on;
gzip_disable "msie6";
gzip_vary on;
gzip_proxied any;
gzip_comp_level 6;
gzip_buffers 16 8k;
gzip_http_version 1.1;
gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

# Настройки буферизации прокси (предотвращают warn-логи и запись на диск)
proxy_buffer_size 128k;
proxy_buffers 4 256k;
proxy_busy_buffers_size 256k;

server {
    listen 80;
    server_name 72roll.ru www.72roll.ru vezuroll.ru www.vezuroll.ru 178.212.13.48 _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name 72roll.ru www.72roll.ru vezuroll.ru www.vezuroll.ru 178.212.13.48 _;
    charset utf-8;
    client_max_body_size 50M;

    ssl_certificate /etc/letsencrypt/live/vezuroll.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vezuroll.ru/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Быстрый резолвер DNS через национальные сервисы РФ (Яндекс DNS + НСДИ Роскомнадзора)
    resolver 77.88.8.8 77.88.8.1 195.208.4.1 valid=300s;
    resolver_timeout 5s;

    location /api {
        resolver 127.0.0.11 valid=30s;
        set $backend_service "http://backend:8000";
        proxy_pass $backend_service;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Раздача медиа-файлов (изображений товаров)
    location /media/ {
        root /var/www/html/admin/public;
        expires 30d;
        add_header Cache-Control "public, no-transform";
        try_files $uri =404;
    }

    # Обслуживание ассетов Vite из корня (необходимо, так как ASSET_URL в .env без /admin)
    location /build/ {
        root /var/www/html/admin/public;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Обслуживание статических файлов из корня или с префиксом /admin или /pers
    location ~ ^/(admin|pers)?/?(favicon.ico|loader.css|robots.txt|sw.js|manifest\.json|pwa-192\.png|pwa-512\.png)$ {
        rewrite ^/(admin|pers)?/?(favicon.ico|loader.css|robots.txt|sw.js|manifest\.json|pwa-192\.png|pwa-512\.png)$ /$2 break;
        root /var/www/html/admin/public;
        expires 30d;
    }

    # Раздача VK Mini App для подтверждения телефонов
    location /vk-app/ {
        alias /var/www/html/admin/public/vk-app/;
        index index.html;
        try_files $uri $uri/ =404;
    }

    # Обслуживание звуковых файлов уведомлений
    location /sounds/ {
        root /var/www/html/admin/public;
        expires 30d;
        add_header Cache-Control "public, no-transform";
        try_files $uri =404;
    }

    # Универсальная обработка для статики в /build/ (с префиксом /admin или /pers)
    location ~ ^/(admin|pers)/build/(.*)$ {
        alias /var/www/html/admin/public/build/$2;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Обработка /admin и /pers через один корень
    location ~ ^/(admin|pers) {
        root /var/www/html/admin/public;
        
        # Если файл существует по пути (например, favicon.ico), отдаем его
        # Если нет, отправляем в index.php
        try_files $uri $uri/ /index.php?$query_string;

        location ~ \.php$ {
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
            fastcgi_pass admin:9000;
            fastcgi_param REQUEST_URI $request_uri;
            fastcgi_param SCRIPT_NAME /index.php;
        }
    }

    # На всякий случай прописываем корень для PHP вне блоков
    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_pass admin:9000;
    }

    location / {
        proxy_pass http://frontend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
